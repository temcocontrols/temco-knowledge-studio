<div class="shell">

	<header class="titlebar">
		<div class="titlebar__left">
			<span class="logo" aria-hidden="true">
				<svg viewBox="0 0 24 24" role="img" aria-label="Temco">
					<rect x="1" y="1" width="22" height="22" rx="5" fill="#224E7A"></rect>
					<path d="M6 7.4h12v2.6h-4.5V18h-3V10H6z" fill="#ffffff"></path>
				</svg>
			</span>
			<nav class="menubar" aria-label="Main menu">
				<button type="button" class="menubar__button" data-menu="File" aria-expanded="false">File</button>
				<button type="button" class="menubar__button" data-menu="Edit" aria-expanded="false">Edit</button>
				<button type="button" class="menubar__button" data-menu="View" aria-expanded="false">View</button>
				<button type="button" class="menubar__button" data-menu="Go" aria-expanded="false">Go</button>
				<button type="button" class="menubar__button" data-menu="Run" aria-expanded="false">Run</button>
				<button type="button" class="menubar__button" data-menu="Tools" aria-expanded="false">Tools</button>
				<button type="button" class="menubar__button" data-menu="Help" aria-expanded="false">Help</button>
			</nav>
		</div>

		<button type="button" class="command-center" id="command-center" data-action="open-command-palette">
			<svg class="icon icon--sm" aria-hidden="true"><use href="#i-search"></use></svg>
			<span class="command-center__label">Temco Platform — search or run a command</span>
			<span class="command-center__keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd></span>
		</button>

		<div class="titlebar__right">
			<button type="button" class="icon-btn" data-action="toggle-sidebar" title="Toggle Primary Side Bar (Ctrl+B)" aria-label="Toggle Primary Side Bar">
				<svg class="icon" aria-hidden="true"><use href="#i-sidebar"></use></svg>
			</button>
			<button type="button" class="icon-btn" data-action="toggle-panel" title="Toggle Panel (Ctrl+J)" aria-label="Toggle Panel">
				<svg class="icon" aria-hidden="true"><use href="#i-panel"></use></svg>
			</button>
			<button type="button" class="icon-btn" data-action="toggle-aux" title="Toggle AI Bar (Ctrl+Alt+B)" aria-label="Toggle AI Bar">
				<svg class="icon" aria-hidden="true"><use href="#i-sparkle"></use></svg>
			</button>
			<span class="titlebar__divider" aria-hidden="true"></span>
			<button type="button" class="icon-btn" data-action="theme" title="Color Theme" aria-label="Color Theme">
				<svg class="icon" aria-hidden="true"><use href="#i-palette"></use></svg>
			</button>
			<div class="window-controls" aria-hidden="true">
				<span>&#8211;</span><span>&#9633;</span><span class="is-close">&#10005;</span>
			</div>
		</div>
	</header>

	<div class="workbench">

		<nav class="activitybar" id="activitybar" aria-label="Temco Platform modules"></nav>

		<aside class="sidebar" id="sidebar" aria-label="Primary side bar">
			<div class="sidebar__header">
				<span class="sidebar__title" id="sidebar-title">Explorer</span>
				<span class="sidebar__actions">
					<button type="button" class="icon-btn" data-action="new-project" title="New" aria-label="New">
						<svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
					</button>
					<button type="button" class="icon-btn" data-action="collapse-all" title="Collapse All" aria-label="Collapse All">
						<svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg>
					</button>
				</span>
			</div>
			<div class="sidebar__body" id="sidebar-body"></div>
		</aside>

		<main class="main" aria-label="Editor">
			<div class="tabs" id="tabs" role="tablist" aria-label="Open surfaces"></div>
			<div class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumbs"></div>
			<div class="editor" id="editor" tabindex="0"></div>

			<section class="panel" id="panel" aria-label="Panel">
				<div class="panel__header">
					<button type="button" class="panel__tab is-active" data-panel="problems">Problems</button>
					<button type="button" class="panel__tab" data-panel="output">Output</button>
					<button type="button" class="panel__tab" data-panel="terminal">Terminal</button>
					<button type="button" class="panel__tab" data-panel="ports">Ports</button>
					<span class="panel__actions">
						<button type="button" class="icon-btn" data-action="panel-problems" title="Focus Problems" aria-label="Focus Problems">
							<svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg>
						</button>
						<button type="button" class="icon-btn" data-action="toggle-panel" title="Close Panel" aria-label="Close Panel">
							<svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
						</button>
					</span>
				</div>
				<div class="panel__body" id="panel-body"></div>
			</section>
		</main>

		<aside class="auxbar" id="auxbar" aria-label="Temco AI">
			<div class="auxbar__header">
				<span class="auxbar__title">Temco AI</span>
				<span class="auxbar__sub">local &middot; qwen2.5-3b</span>
				<button type="button" class="icon-btn" data-action="toggle-aux" title="Close AI Bar" aria-label="Close AI Bar">
					<svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
				</button>
			</div>
			<div class="chat" id="chat"></div>
			<form class="chat__composer" id="chat-form">
				<textarea id="chat-input" rows="2" placeholder="Ask about this page, its area or the sources behind it…" aria-label="Ask Temco AI"></textarea>
				<div class="chat__row">
					<span class="chip" id="chat-context">Overview</span>
					<button type="submit" class="btn btn--primary btn--sm">Send</button>
				</div>
			</form>
		</aside>
	</div>

	<footer class="statusbar">
		<div class="statusbar__group">
			<button type="button" class="statusbar__item" data-action="branch" title="Git branch">
				<svg class="icon" aria-hidden="true"><use href="#i-branch"></use></svg>
				<span>t3000</span>
			</button>
			<button type="button" class="statusbar__item" data-action="sync" title="Synchronise changes">
				<svg class="icon" aria-hidden="true"><use href="#i-sync"></use></svg>
				<span>0&uarr; 0&darr;</span>
			</button>
			<button type="button" class="statusbar__item" data-action="panel-problems" title="Problems">
				<svg class="icon" aria-hidden="true"><use href="#i-error"></use></svg>
				<span>2</span>
