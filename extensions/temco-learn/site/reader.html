<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temco Learn</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/reader.css">
</head>
<body data-page="reader">
<header class="r-bar">
	<a class="r-brand" href="index.html">Temco Learn</a>
	<span class="r-product" id="product"></span>
	<span class="r-spacer"></span>
	<select class="r-version" id="version" aria-label="Version" hidden></select>
	<input class="r-search" id="search" type="search" placeholder="Search this version…" aria-label="Search this version">
</header>

<div class="r-cols">
	<nav class="r-nav" aria-label="Documentation">
		<div class="r-nav__head" id="nav-head"></div>
		<ul id="nav-list">
			<li class="r-nav__empty">Loading…</li>
		</ul>
	</nav>

	<main class="r-main">
		<div class="r-crumbs" id="crumbs"></div>
		<iframe class="r-page" id="page" title="Page" src="about:blank"></iframe>
		<div class="r-pager">
			<a id="prev" href="#" aria-disabled="true">‹ Previous</a>
			<span class="r-spacer"></span>
			<a id="next" href="#" aria-disabled="true">Next ›</a>
		</div>
	</main>

	<aside class="r-toc" aria-label="In this article">
		<div class="r-toc__head">In this article</div>
		<ul id="headings"><li class="r-toc__empty">—</li></ul>
		<div class="r-toc__foot" id="foot"></div>
	</aside>
</div>

<footer class="r-foot">
	<span id="count"></span>
	<span class="r-spacer"></span>
	<a href="https://forums.temcocontrols.com/" rel="noopener">Forum</a>
	<a href="https://github.com/temcocontrols" rel="noopener">GitHub</a>
</footer>
<script src="assets/site.js"></script>
</body>
</html>
